plugins { id 'com.android.application' }
android {
  namespace 'music.psai.visualizer'
  compileSdk 35
  defaultConfig { applicationId 'music.psai.visualizer'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('syncWeb', Copy) {
  from('../../') { include 'index.html', 'styles.css', 'app.js', 'icon.svg', 'manifest.webmanifest', 'sw.js' }
  into('src/main/assets/web')
}
tasks.named('preBuild').configure { dependsOn tasks.named('syncWeb') }
